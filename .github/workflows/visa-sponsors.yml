name: Visa sponsors

# Rebuilds src/jobs/visa.json: H-1B approvals per company in Jobs for you, from USCIS's free
# H-1B Employer Data Hub. Monthly, by hand, or when the builder changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 13 3 * *"
  # on main only: these commit their results, and must not commit onto other branches (a
  # Dependabot branch once picked up a stray results commit)
  push:
    branches: [main]
    paths:
      - src/jobs/visa-build.ts
      - .github/workflows/visa-sponsors.yml

permissions:
  contents: write

concurrency:
  group: visa-sponsors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prod
        env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
      - run: node src/jobs/visa-build.ts
      - name: Commit the list if it changed
        run: |
          git diff --quiet src/jobs/visa.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jobs/visa.json
          git commit -m "Visa sponsors: refresh H-1B approvals"
          # another workflow may have pushed meanwhile: replay this commit on top, then push
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && exit 0; sleep $((i * 5)); done; exit 1
