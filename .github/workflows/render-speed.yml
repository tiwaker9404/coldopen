name: Render speed

# Times what a film costs on the same runner the hosted app renders on: setting up ffmpeg and
# fonts, then one film from the fixture sites rendered with 1 page and with 3 pages at once.
# Run it by hand (Actions, Render speed, Run workflow). Uses only the fictional fixture sites and
# the built-in writer, so it needs no secrets.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Page counts to compare, space-separated"
        default: "1 3 1 3"

jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - uses: actions/cache@v4
        id: tools-cache
        with:
          path: ~/.cache/coldopen-tools
          key: render-tools-${{ runner.os }}-${{ hashFiles('.github/scripts/render-tools.sh') }}
      - name: ffmpeg and fonts
        id: tools
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          t0=$(date +%s.%N)
          bash .github/scripts/render-tools.sh
          sec=$(echo "$(date +%s.%N) - $t0" | bc)
          echo "RESULT tools=${sec}s cache-hit=${{ steps.tools-cache.outputs.cache-hit || 'false' }}"
          echo "sec=$sec" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --prod
        env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
      - name: Render the same film with different page counts
        run: |
          nproc
          node fixtures/serve.ts > /dev/null &
          sleep 2
          {
            echo "### Render speed on $(nproc) cores"
            echo
            echo "ffmpeg and fonts: ${{ steps.tools.outputs.sec }}s (cache hit: ${{ steps.tools-cache.outputs.cache-hit || 'false' }})"
            echo
            echo "| pages | film total | render | frames | output |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          i=0
          for p in ${{ inputs.pages }}; do
            i=$((i + 1))
            out="speed-$i"
            log=$(RENDER_PAGES=$p node src/cli.ts http://127.0.0.1:4100/parcelpine/ \
              -p profiles/candidate.example.json -o "$out" 2>&1)
            echo "$log"
            total=$(echo "$log" | awk '/^  total/ {print $2}')
            render=$(echo "$log" | awk '/^  render/ {print $5}')
            frames=$(echo "$log" | awk '/^  render/ {print $2}')
            # the decoded frames, not the file: the container's timestamps differ run to run
            sum=$(ffmpeg -v error -i "$out"/*/film-square.mp4 -f framemd5 - | md5sum | cut -c1-10)
            echo "RESULT pages=$p total=$total render=$render frames=$frames output=$sum"
            echo "| $p | $total | $render | $frames | $sum |" >> "$GITHUB_STEP_SUMMARY"
          done
