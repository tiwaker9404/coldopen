name: CI

on:
  push:
    branches: [main]
  pull_request:

# read the code, nothing more: no writes to the repo, issues or packages
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm dashboard:build
      - name: Dependencies with known high or critical vulnerabilities
        run: pnpm audit --audit-level high --prod

  test:
    name: Tests and quality evals
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: coldopen_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/coldopen_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      # pnpm's side-effects cache can skip Puppeteer's postinstall (the lint job installs with
      # downloads off), so fetch the matching Chrome explicitly
      - run: pnpm exec puppeteer browsers install chrome
      - run: pnpm test
      - name: Chaos test (SIGKILL a renderer mid-film)
        run: pnpm test:chaos
      - name: Quality evals (brand fidelity, grounding, contrast, overflow)
        run: pnpm evals
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: evals/results.md }
      - name: UI audit (accessibility, console errors, phone overflow, security headers)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/coldopen_test
          LLM_PROVIDER: none
          PORT: "8080"
        run: |
          pnpm dashboard:build
          node src/main.ts migrate
          node src/main.ts api > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz >/dev/null && break; sleep 1; done
          node scripts/audit-ui.ts http://localhost:8080 site

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          {
            context: .,
            push: false,
            tags: "coldopen:ci",
            cache-from: type=gha,
            cache-to: "type=gha,mode=max",
          }
