name: Render films for the hosted app

# The hosted app's web server (on Render's free plan) has no room for Chromium, so films are
# rendered here: the app starts this workflow when someone makes a film, and the job renders
# everything queued, then exits. Free for public repositories.
#
# Turn it on with the repository variable RENDER_FILMS=true and these secrets:
#   DATABASE_URL  the same database as the app (Supabase session pooler, ?sslmode=require)
#   LLM_API_KEY   Groq key
#   GEMINI_API_KEY  optional: a free Google AI Studio key, the last model tried when Groq is busy
#   SHARE_URL, SHARE_TOKEN   the share worker films are published to
on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
  # a safety net: picks up films whose start signal was lost, and retries after backoff
  schedule:
    - cron: "*/15 * * * *"

# One job per lane. The app starts up to RENDER_RUNNERS lanes when films pile up, so a burst
# renders side by side; a start signal for a busy lane waits for it. The schedule uses lane 0.

# read the code, nothing more: no writes to the repo, issues or packages
permissions:
  contents: read

concurrency:
  group: render-${{ github.event.client_payload.slot || 0 }}
  cancel-in-progress: false

jobs:
  render:
    if: vars.RENDER_FILMS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SHARE_URL: ${{ secrets.SHARE_URL }}
      SHARE_TOKEN: ${{ secrets.SHARE_TOKEN }}
      LLM_PROVIDER: openai
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: openai/gpt-oss-120b
      # a "gemini:" model is used only when GEMINI_API_KEY is set
      LLM_FALLBACK_MODEL: openai/gpt-oss-20b,gemini:gemini-3.8-flash
      CHROME_PATH: /usr/bin/google-chrome
      # (the runner context isn't available at job level, so a fixed path)
      FILMS_DIR: /tmp/coldopen-films
      # one film per job, with all 4 cores: 3 scenes at once. More films start more jobs
      WORKER_CONCURRENCY: "1"
      RENDER_PAGES: "3"
      # this repository is public, and so are its logs. A failed film's error names the site it
      # was for, so only startup failures are logged here; why films failed is kept in the
      # database (the app's Launch numbers). The per-film timing line has no film details.
      LOG_LEVEL: fatal
    steps:
      - name: Anything to render?
        id: queue
        run: |
          # films no other job is rendering: queued (or due to retry soon), or left by a job that died
          n=$(psql "$DATABASE_URL" -tAc "select count(*) from runs where (status = 'queued' and next_run_at <= now() + interval '5 minutes') or (status = 'running' and lease_expires_at < now())" 2>/dev/null || echo 1)
          echo "pending=$n" >> "$GITHUB_OUTPUT"
      - if: steps.queue.outputs.pending != '0'
        uses: actions/checkout@v5
      - if: steps.queue.outputs.pending != '0'
        uses: pnpm/action-setup@v6
      - if: steps.queue.outputs.pending != '0'
        uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      # ffmpeg and fonts from a cache: installing them with apt took ~37s of every film
      - if: steps.queue.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/coldopen-tools
          key: render-tools-${{ runner.os }}-${{ hashFiles('.github/scripts/render-tools.sh') }}
      - if: steps.queue.outputs.pending != '0'
        run: bash .github/scripts/render-tools.sh
        env: { GH_TOKEN: "${{ github.token }}" }
      - if: steps.queue.outputs.pending != '0'
        run: pnpm install --frozen-lockfile --prod
        env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
      - if: steps.queue.outputs.pending != '0'
        run: node src/main.ts drain
