# Publishes site/ (the landing page) to GitHub Pages on every push to main that touches it.
# One-time setup in the repo: Settings > Pages > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the Hiring Index's latest numbers live on the data branch (its daily workflow writes them)
      - name: The Hiring Index's numbers
        run: |
          git fetch --depth=1 origin data || exit 0
          git show origin/data:hiring-index/data.json > site/hiring-index/data.json || rm -f site/hiring-index/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
