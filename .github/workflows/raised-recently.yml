name: Raised recently

# Rebuilds src/jobs/raised.json: which companies in Jobs for you filed an SEC Form D in the
# last 3 months, from EDGAR's quarterly form index (two downloads). Daily, or by hand.
# SEC asks automated clients for a contact: set the repository variable SEC_USER_AGENT, e.g.
# "coldopen you@example.com".
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Only report how many raised in this many days (changes nothing)"
        required: false
        default: ""
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: write

concurrency:
  group: raised-recently-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prod
        env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
      - run: node src/jobs/raised-build.ts
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          RAISED_REPORT_DAYS: ${{ inputs.days }}
      - name: Commit the list if it changed
        run: |
          git diff --quiet src/jobs/raised.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jobs/raised.json
          git commit -m "Raised recently: refresh recent Form D filings"
          # another workflow may have pushed meanwhile: replay this commit on top, then push
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && exit 0; sleep $((i * 5)); done; exit 1
