name: Raised recently

# Rebuilds src/jobs/raised.json: which companies in Jobs for you filed an SEC Form D in the last
# 12 months, from EDGAR. Run by hand.
on:
  # manual only for now: EDGAR throttles GitHub's runners, and a run can take half an hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raised-recently-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prod
        env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
      - run: node src/jobs/raised-build.ts
      - name: Commit the list if it changed
        run: |
          git diff --quiet src/jobs/raised.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jobs/raised.json
          git commit -m "Raised recently: refresh recent Form D filings"
          git push
