name: Deploy the hosted demo

# Pushes the app to the Hugging Face Space on every change to main. Needs one repository
# secret, HF_TOKEN (a Hugging Face token with write access), and the repository variable
# HF_SPACE, e.g. "tiwaker9404/coldopen". Without them this workflow does nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "*.md", "launch/**"]
  workflow_dispatch:

concurrency: space

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@v4
      - name: Build the Space's tree
        run: |
          # a Space is a git repo with its own README and Dockerfile; binary media stays on GitHub
          rm -rf .git site docs/media launch
          cp deploy/huggingface/README.md README.md
          cp deploy/huggingface/Dockerfile Dockerfile
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git init -q -b main
          git config user.name "coldopen deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
