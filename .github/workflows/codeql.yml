name: CodeQL

# GitHub's code scanning: injection, SSRF, XSS, path traversal and the like, across the
# TypeScript, on every change and weekly
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
