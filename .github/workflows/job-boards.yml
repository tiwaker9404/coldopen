name: Job boards

# Checks every default job board in src/jobs/companies.ts against its live public API, so a
# company that moves to another applicant tracking system (and its dead board) gets noticed.
on:
  push:
    branches: [suggested-jobs]
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prod
        env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
      - run: node src/jobs/check.ts greenhouse:postman lever:postman ashby:postman greenhouse:dbtlabs lever:dbtlabs ashby:dbtlabs greenhouse:dbt-labs lever:dbt-labs ashby:dbt-labs greenhouse:temporal lever:temporal ashby:temporal greenhouse:temporaltechnologies lever:temporaltechnologies ashby:temporaltechnologies greenhouse:hightouch lever:hightouch ashby:hightouch greenhouse:anyscale lever:anyscale ashby:anyscale greenhouse:runway lever:runway ashby:runway greenhouse:runwayml lever:runwayml ashby:runwayml greenhouse:wandb lever:wandb ashby:wandb greenhouse:weightsandbiases lever:weightsandbiases ashby:weightsandbiases greenhouse:together lever:together ashby:together greenhouse:togetherai lever:togetherai ashby:togetherai greenhouse:together-ai lever:together-ai ashby:together-ai greenhouse:plaid lever:plaid ashby:plaid greenhouse:mistral lever:mistral ashby:mistral greenhouse:cursor lever:cursor ashby:cursor greenhouse:anysphere lever:anysphere ashby:anysphere greenhouse:retool lever:retool ashby:retool greenhouse:hebbia lever:hebbia ashby:hebbia greenhouse:humandelta lever:humandelta ashby:humandelta greenhouse:human-delta lever:human-delta ashby:human-delta greenhouse:hive lever:hive ashby:hive greenhouse:thehive lever:thehive ashby:thehive greenhouse:hiveai lever:hiveai ashby:hiveai greenhouse:ascend lever:ascend ashby:ascend greenhouse:ascendio lever:ascendio ashby:ascendio greenhouse:rippling lever:rippling ashby:rippling greenhouse:zoox lever:zoox ashby:zoox || true
