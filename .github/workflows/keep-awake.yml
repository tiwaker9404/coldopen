name: Keep awake

# Render's free plan sleeps the app after 15 idle minutes, and the next visitor waits ~50 seconds
# for it to wake. A ping every 10 minutes keeps it ready; the free plan's 750 hours a month cover
# one service running all month.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the hosted app
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 90 https://coldopen-nk8o.onrender.com/healthz && exit 0
            sleep 20
          done
          echo "::warning::the hosted app didn't answer"
