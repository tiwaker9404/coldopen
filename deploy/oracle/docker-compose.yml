# The hosted coldopen on one always-free Oracle Cloud server: the app, its database, and
# Caddy for HTTPS. Settings come from .env next to this file (deploy/oracle/setup.sh writes it).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: coldopen
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coldopen"]
      interval: 5s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # the database next door, unless .env points somewhere else (e.g. Supabase)
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${DB_PASSWORD}@db:5432/coldopen}
      HOSTED: "true"
      PORT: "8080"
      WORKER_CONCURRENCY: "2"
    volumes:
      - films:/data/films
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    # a free HTTPS certificate for DOMAIN, renewed automatically
    command: caddy reverse-proxy --from ${DOMAIN} --to app:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      - app

volumes:
  db:
  films:
  caddy:
